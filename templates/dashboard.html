{% extends "base.html" %}

{% block content %}
<style>
    body {
        margin: 0;
        background: #111;
        color: #f1f1f1;
        font-family: Arial, sans-serif;
    }

    .dashboard-wrapper {
        min-height: 100vh;
        padding: 40px;
        background: #111;
    }

    .dashboard-card {
        max-width: 900px;
        margin: 0 auto;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 10px;
        padding: 32px;
    }

    h1 {
        margin-top: 0;
        font-size: 28px;
    }

    .subtext {
        color: #999;
        margin-bottom: 24px;
    }

    .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-top: 24px;
    }

    .stat-link {
        text-decoration: none;
        color: inherit;
        display: block;
    }

    .stat-box {
        background: #111;
        border: 1px solid #2f2f2f;
        border-radius: 8px;
        padding: 20px;
        transition: all 0.2s ease;
    }

    .stat-box:hover {
        background: #1a1a1a;
        border-color: #444;
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .stat-box h2 {
        margin: 0 0 8px;
        font-size: 16px;
        color: #bbb;
    }

    .stat-box p {
        margin: 0;
        font-size: 24px;
        font-weight: bold;
        color: #fff;
    }
</style>

<div class="dashboard-wrapper">
    <div class="dashboard-card">
        <h1>Dashboard</h1>
        <p class="subtext">Welcome, {{ request.user.first_name }} (Employee ID: {{ request.user.employee_id }})</p>

        <div class="stats">
            <a href="{% url 'ticket_list' %}?status=open" class="stat-link">
                <div class="stat-box">
                    <h2>Open Tickets</h2>
                    <p>{{ open_count }}</p>
                </div>
            </a>
            <a href="{% url 'ticket_list' %}?status=pending" class="stat-link">
                <div class="stat-box">
                    <h2>Pending Tickets</h2>
                    <p>{{ pending_count }}</p>
                </div>
            </a>
            <a href="{% url 'ticket_list' %}?status=closed" class="stat-link">
                <div class="stat-box">
                    <h2>Closed Tickets</h2>
                    <p>{{ closed_count }}</p>
                </div>
            </a>
        </div>
    </div>
</div>
{% endblock %}
