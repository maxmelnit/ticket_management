{% extends "base.html" %}

{% block content %}
<h1>Tickets</h1>
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Subject</th>
            <th>Status</th>
            <th>Issue Type</th>
            <th>Created</th>
        </tr>
    </thead>
    <tbody>
        {% for ticket in tickets %}
        <tr>
            <td>{{ ticket.id }}</td>
            <td>{{ ticket.subject }}</td>
            <td>{{ ticket.status }}</td>
            <td>{{ ticket.issue_type }}</td>
            <td>{{ ticket.created_at }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="5">No tickets found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
